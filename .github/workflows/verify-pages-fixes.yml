name: Verify Pages fixes

on:
  push:
    branches:
      - fix/pages-navigation-theme-examples

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pages-navigation-theme-examples
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: Refresh manifest
        run: python tools/update_manifest.py
      - name: Validate repository
        run: make validate && make validate-normative
      - name: Generate documentation
        run: python tools/generate_site_docs.py
      - name: Verify generated detail routes
        run: |
          test -f .site-docs/profiles/reusable-library/index.md
          test -f .site-docs/modifiers/public-api/index.md
          test -f .site-docs/languages/python/index.md
          test -f .site-docs/frameworks/nextjs/index.md
          test -f .site-docs/evaluations/nextjs-payment-webhook/index.md
          grep -q 'href="nextjs-payment-webhook/"' .site-docs/evaluations/index.md
          if grep -q 'github.com/PeterRamotowski/code-principles/blob/main/evaluations/scenarios' .site-docs/evaluations/index.md; then
            echo 'Evaluation catalogue still links directly to repository YAML.' >&2
            exit 1
          fi
      - name: Build documentation
        run: mkdocs build
      - name: Commit refreshed manifest
        run: |
          if git diff --quiet -- MANIFEST.sha256; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "chore: refresh distribution manifest"
          git push origin HEAD:fix/pages-navigation-theme-examples
