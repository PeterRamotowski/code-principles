schema_version: 0.5.0
id: explicit-over-implicit
name: Explicit Is Better Than Implicit
aliases: []
classification: heuristic
category: simplicity-and-clarity
status: candidate
summary: Make important dependencies, state changes, defaults, and control flow visible.
canonical_statement: Prefer explicit behavior when hidden conventions would make correctness or maintenance
  harder to reason about.
intent: Make important dependencies, state changes, defaults, and control flow visible.
applies_when:
- The code must be understood and changed by people other than its author.
- A simpler implementation satisfies the current verified requirements.
does_not_mean:
- Do not reject well-established language or framework conventions merely because they are implicit.
- Do not make every default noisy when it is safe and universally understood.
trade_offs:
- Local simplicity can conflict with extensibility, reuse, or performance requirements.
- Reducing visible code can increase hidden behavior; clarity is more important than terseness.
conflicts_with: []
reinforces:
- no-magic
- principle-of-least-astonishment
primary_core_skill: code-clarity
example: Inject a required dependency and name a transaction boundary.
counterexample: Create a dependency through a hidden global lookup during method execution.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with:
- conciseness
- framework-convention
supports_concerns: []
