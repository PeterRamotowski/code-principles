schema_version: 0.3.0
id: meaningful-names
name: Meaningful Names
aliases: []
classification: heuristic
category: simplicity-and-clarity
status: candidate
summary: Use names that communicate domain meaning, role, and units.
canonical_statement: A name should help a reader understand what a value or operation represents without
  decoding implementation history.
intent: Use names that communicate domain meaning, role, and units.
applies_when:
- The code must be understood and changed by people other than its author.
- A simpler implementation satisfies the current verified requirements.
does_not_mean:
- Do not make names long merely to restate the type.
- Do not use domain terminology inconsistently.
trade_offs:
- Local simplicity can conflict with extensibility, reuse, or performance requirements.
- Reducing visible code can increase hidden behavior; clarity is more important than terseness.
conflicts_with: []
reinforces:
- principle-of-least-astonishment
- self-documenting-code
primary_core_skill: code-clarity
example: Name a duration `retryDelayMilliseconds` when the unit matters.
counterexample: Name important values `data`, `tmp`, or `manager` without a specific role.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with:
- local-conventions
supports_concerns: []
