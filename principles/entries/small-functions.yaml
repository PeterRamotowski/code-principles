schema_version: 0.7.0
id: small-functions
name: Small Functions
aliases: []
classification: heuristic
category: simplicity-and-clarity
status: candidate
summary: Prefer functions that represent one coherent operation and can be understood locally.
canonical_statement: Function size should follow conceptual cohesion, not a universal line limit.
intent: Prefer functions that represent one coherent operation and can be understood locally.
applies_when:
- The code must be understood and changed by people other than its author.
- A simpler implementation satisfies the current verified requirements.
does_not_mean:
- Do not split cohesive logic into fragments that require constant jumping.
- Do not count lines as a substitute for reviewing responsibility.
trade_offs:
- Local simplicity can conflict with extensibility, reuse, or performance requirements.
- Reducing visible code can increase hidden behavior; clarity is more important than terseness.
conflicts_with:
- locality-of-behaviour
- single-level-of-abstraction
reinforces:
- single-responsibility-principle
primary_core_skill: code-clarity
example: Extract a meaningful `calculateTax()` operation with its complete rule.
counterexample: Create ten one-line wrappers that hide a straightforward calculation.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with: []
supports_concerns: []
