schema_version: 0.3.0
id: test-pyramid
name: Test Pyramid
aliases: []
classification: testing-strategy
category: testing-and-verification
status: candidate
summary: Use many fast focused tests, fewer integration tests, and a small number of broad end-to-end
  tests as a starting heuristic.
canonical_statement: Choose the test distribution according to architecture and failure risk rather than
  enforcing a fixed geometric ratio.
intent: Use many fast focused tests, fewer integration tests, and a small number of broad end-to-end tests
  as a starting heuristic.
applies_when:
- Behavior must remain correct through change.
- Risk, complexity, or public contracts justify automated verification.
does_not_mean:
- Do not mock every boundary merely to increase unit-test count.
- Do not treat slow end-to-end coverage as a substitute for focused diagnostics.
trade_offs:
- Tests can over-couple to implementation details.
- A testing method that improves one feedback loop can slow another.
conflicts_with: []
reinforces:
- first-tests
- test-behaviour-not-implementation
primary_core_skill: testing-strategy
example: Test pure rules directly, database boundaries through integration tests, and critical journeys
  end to end.
counterexample: Replace all meaningful integration tests with mocks to preserve a pyramid shape.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with:
- framework-integration
- testing-trophy
supports_concerns: []
