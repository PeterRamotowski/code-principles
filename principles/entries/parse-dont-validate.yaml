schema_version: 0.2.0
id: parse-dont-validate
name: Parse, Don’t Validate
aliases: []
classification: principle
category: contracts-errors-and-security
status: candidate
summary: Transform untrusted input into types that represent validated meaning.
canonical_statement: Validation should produce a trusted representation, not merely a boolean followed
  by continued use of raw data.
intent: Transform untrusted input into types that represent validated meaning.
applies_when:
- Data or control crosses a trust, process, module, or API boundary.
- Invalid state could threaten correctness, security, or recoverability.
does_not_mean:
- Do not assume parsing can encode every cross-record business rule.
- Do not discard useful error detail.
trade_offs:
- Stricter contracts can reduce compatibility with inconsistent external producers.
- Defensive checks can duplicate validation if trust boundaries are not explicit.
conflicts_with:
- performance-budgeting
reinforces:
- fail-fast
- make-illegal-states-unrepresentable
primary_core_skill: contracts-and-errors
example: Parse a raw currency string into a validated Money value.
counterexample: Call `isValid(raw)` and then pass the same raw dictionary throughout the system.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with:
- tolerant-input
supports_concerns: []
