schema_version: 0.5.0
id: liskov-substitution-principle
name: Liskov Substitution Principle
aliases: []
classification: principle
category: modularity-and-object-design
status: candidate
summary: Subtypes must preserve the behavioral contract expected of the base abstraction.
canonical_statement: A substitutable implementation must not strengthen preconditions, weaken guarantees,
  or violate observable invariants.
intent: Subtypes must preserve the behavioral contract expected of the base abstraction.
applies_when:
- Responsibilities change for different reasons or at different rates.
- A boundary can reduce coupling or protect an invariant.
does_not_mean:
- Do not reduce LSP to matching method signatures.
- Do not force inheritance where implementations have incompatible semantics.
trade_offs:
- More modules and interfaces increase navigation and integration cost.
- A boundary that does not protect independent change can become ceremony.
conflicts_with: []
reinforces:
- design-by-contract
- principle-of-least-astonishment
primary_core_skill: modular-design
example: Every storage implementation preserves documented transaction and error semantics.
counterexample: A read-only subclass inherits a mutable base type and throws for required operations.
ai_guidance:
- Apply this guidance only after considering the active project profile, constraints, and architecture
  authority.
- State the concrete design consequence instead of citing the principle name as sufficient justification.
notes: []
tensions_with:
- performance-specialization
supports_concerns: []
